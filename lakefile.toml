# nanodregg — the one build (owner: BUILD-GATES).
#
# - No package dependencies. Lean core and Std only: no Mathlib, no Batteries (decisions/gates.md GATES-1).
# - One `lean_lib` per top-level layer directory, rooted by glob, so every file in the directory
#   is built and none can be an orphan (gates/closure.py refuses a .lean file outside a lib).
#   A layer adds its entry here in the same commit as its first .lean file (a glob over a
#   directory that does not exist in the commit fails the build).
# - Warnings are errors; implicit auto-bound variables are off.
name = "nanodregg"
defaultTargets = ["Codec", "Kernel", "Protocol"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

# The axiom census command (Census.Axioms): build tooling, the only place `import Lean` is
# allowed; nothing outside Census may import it (gates/closure.py C2, C5).
[[lean_lib]]
name = "Census"
globs = ["Census.+"]

[[lean_lib]]
name = "Kernel"
globs = ["Kernel.+"]

[[lean_lib]]
name = "Protocol"
globs = ["Protocol.+"]

[[lean_lib]]
name = "Host"
globs = ["Host.+"]

[[lean_lib]]
name = "Lang"
globs = ["Lang.+"]

[[lean_lib]]
name = "Codec"
globs = ["Codec.+"]

# The Rust copy of the protocol table (client/src/generated.rs). Imports Protocol; nothing imports it.
[[lean_lib]]
name = "Emit"
globs = ["Emit.+"]

[[lean_exe]]
name = "emit-rust"
root = "Emit.Rust"
