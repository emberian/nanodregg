[package]
name = "nanodregg-launcher"
version = "0.0.0"
edition = "2024"
publish = false
description = "grain-launch: starts and stops grains exactly as the Lean controller's frames say, each through nanodregg_sandbox::command. Decides nothing."


[lib]
path = "src/lib.rs"

[[bin]]
name = "grain-launch"
path = "src/bin/grain-launch.rs"

# The isolation test's grain: tries each of its targets and writes what happened into its volume.
[[bin]]
name = "probe"
path = "src/bin/probe.rs"

# The provider-key broker's byte mover: the operator's key file, one socket per resident, the
# upstream call; every verdict is the Lean decider's (hosting-broker).
[[bin]]
name = "keybroker"
path = "src/bin/keybroker.rs"

[dependencies]
nanodregg-sandbox = { path = "../sandbox" }
# The key bytes are zeroized on drop (the type custody::read_private returns).
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
