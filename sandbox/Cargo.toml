[package]
name = "nanodregg-sandbox"
version = "0.0.0"
edition = "2024"
publish = false
description = "Launch a child under one confinement shape, and read a custody file under the custody checks. Plumbing only: what the child may see is a policy given to it, never chosen here."


[lib]
path = "src/lib.rs"

[dependencies]
rustix = { version = "=1.1.2", default-features = false, features = ["std", "fs", "process", "net"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

# Linux self-confinement (CLIENT-48): Landlock rules and seccomp programs built in the launcher,
# applied by the child to itself before exec. libc for the system call numbers only.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "=0.4.5", default-features = false }
seccompiler = { version = "=0.4.0", default-features = false }
libc = { version = "=0.2.190", default-features = false }

[dev-dependencies]
nanodregg-devtools = { path = "../devtools" }

[lints.rust]
# deny, not forbid: exactly two sites allow it (the pre-exec step in linux.rs, the connector's
# descriptor claim in connector.rs), each with its SAFETY argument.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
