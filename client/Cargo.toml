[package]
name = "nanodregg-client"
version = "0.0.0"
edition = "2024"
publish = false
description = "Custody, transport and workspace for one member: moves bytes between two sockets and signs what consent approved. Decides nothing."


[lib]
path = "src/lib.rs"

[[bin]]
name = "nd"
path = "src/bin/nd.rs"

[[bin]]
name = "nd-supervise"
path = "src/bin/nd-supervise.rs"

[dependencies]
nanodregg-sandbox = { path = "../sandbox" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
rustix = { version = "=1.1.2", default-features = false, features = ["std", "fs", "process"] }
zeroize = { version = "=1.8.2", default-features = false }
# nd-supervise's SIGTERM (CLIENT-30): a safe self-pipe iterator (two fds, MuxLimits::fds_max) and
# the default action re-raised. Trusted, unverified: it holds the unsafe sigaction this crate forbids.
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }

[dev-dependencies]
nanodregg-devtools = { path = "../devtools" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
