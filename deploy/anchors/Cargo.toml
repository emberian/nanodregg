[package]
name = "nanodregg-anchors"
version = "0.0.0"
edition = "2024"
publish = false
description = "Emit the broker's production TLS trust anchors from the pinned webpki-root-certs, or check a shipped file against them byte for byte (HOSTING-15). Decides nothing: the roots are the crate's."

[[bin]]
name = "emit-anchors"
path = "src/main.rs"

[dependencies]
# Production trust is pinned by build: this exact version, its roots in its order.
webpki-root-certs = { version = "=1.0.9", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
